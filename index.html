<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Démo - Modèle Éternel</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background-color: #fbfbf9; color: #2c2c2c; text-align: center; }
        .hero { padding: 80px 20px; background: #ffffff; border-bottom: 1px solid #eaeae6; }
        .names { font-family: 'Great Vibes', cursive; font-size: 50px; color: #c5a059; margin: 0; }
        .sub { font-size: 14px; text-transform: uppercase; letter-spacing: 3px; color: #777; margin-bottom: 20px; }
        #countdown { font-size: 20px; font-weight: 600; color: #c5a059; margin: 20px 0; }
        .section { padding: 40px 20px; max-width: 800px; margin: 0 auto; }
        h2 { font-family: 'Great Vibes', cursive; font-size: 35px; color: #c5a059; margin-bottom: 20px; }
        .programme { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }
        .etape { background: #fff; padding: 20px; border: 1px solid #f0edf0; width: 180px; border-radius: 8px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .gallery-grid img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .cta-box { padding: 60px 20px; background-color: #111111; color: #ffffff; }
        .btn-commander { display: inline-block; background: #c5a059; color: #111; text-decoration: none; font-weight: bold; padding: 15px 30px; border-radius: 4px; margin-top: 20px; }
    </style>
</head>
<body>

    <header class="hero">
        <h1 class="names">Sarah & Marc</h1>
        <p class="sub">Se disent "Oui" pour l'éternité</p>
        <div id="countdown">Chargement...</div>
    </header>

    <section class="section">
        <h2>Le Programme</h2>
        <div class="programme">
            <div class="etape"><h3>15h30</h3><p>Cérémonie</p></div>
            <div class="etape"><h3>17h00</h3><p>Cocktail</p></div>
            <div class="etape"><h3>20h00</h3><p>Dîner</p></div>
        </div>
    </section>

    <section class="section">
        <h2>Galerie Photos</h2>
        <div class="gallery-grid">
            <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=400&q=80" alt="Mariage">
            <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=400&q=80" alt="Mariage">
        </div>
    </section>

    <section class="section">
        <h2>Confirmer votre présence</h2>
        <iframe data-tally-src="https://tally.so/embed/RG299p?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" width="100%" height="400" frameborder="0" title="RSVP"></iframe>
    </section>

    <div class="cta-box">
        <h2>Ce modèle vous plaît ?</h2>
        <a href="https://wa.me/243XXXXXXXXX?text=Bonjour%20Smartech,%20je%20souhaite%20commander%20le%20modèle%20Éternel" 
           target="_blank" class="btn-commander">🛒 Commander ce modèle</a>
    </div>

    <script>
        // Compte à rebours
        var weddingDate = new Date("Sep 12, 2026 15:30:00").getTime();
        var x = setInterval(function() {
            var now = new Date().getTime();
            var distance = weddingDate - now;
            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("countdown").innerHTML = days + " jours avant le grand jour !";
        }, 1000);
    </script>
    <script async src="https://tally.so/widgets/embed.js"></script>
</body>
</html>
